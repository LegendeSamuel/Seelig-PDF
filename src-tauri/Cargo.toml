[package]
name = "seelig-pdf"
version = "1.0.0"
description = "Seelig PDF – Sicherer PDF-Reader und 33 PDF-Werkzeuge"
authors = ["Samuel Seelig"]
edition = "2021"
license = "MIT"

[lib]
name = "seelig_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true
