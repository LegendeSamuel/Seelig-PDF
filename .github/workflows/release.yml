name: Release Desktop (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Draft Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies & Chromium
        run: |
          npm ci
          npx playwright install chromium

      - name: Verify full Web, Security & Red-Team suite
        run: npm run verify:all

      - name: Verify Rust tests & clippy
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Inject Updater Public Key (when configured)
        shell: pwsh
        run: |
          $pub = "${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}"
          if (-not [string]::IsNullOrWhiteSpace($pub)) {
            $conf = Get-Content src-tauri/tauri.release.conf.json -Raw
            $conf = $conf.Replace("__REPLACE_WITH_TAURI_SIGNING_PUBLIC_KEY__", $pub.Trim())
            Set-Content src-tauri/tauri.release.conf.json $conf -Encoding UTF8
          }

      - name: Build Windows Installer (NSIS + MSI)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace("${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}")) {
            npx tauri build --config src-tauri/tauri.release.conf.json
          } else {
            npx tauri build
          }

      - name: Collect installers, latest.json & SHA256SUMS.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $files = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.exe, *.msi, *.sig -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            # Normalize whitespace to dots so uploaded GitHub Release filenames match latest.json URLs verbatim
            $safeName = $f.Name -replace '\s+', '.'
            Copy-Item $f.FullName -Destination (Join-Path 'release-assets' $safeName) -Force
          }
          $hashes = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          Set-Content release-assets/SHA256SUMS.txt ($hashes -join "`n") -Encoding utf8NoBOM

          $tag = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $matches[1] } else { '1.0.1' }
          $notes = "Siehe GitHub-Release-Notizen fuer v$tag."
          if (Test-Path CHANGELOG.md) {
            $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
            $escapedTag = [regex]::Escape($tag)
            if ($changelog -match "(?ms)^##\s+v$escapedTag\s*\r?\n(.*?)(?=^##\s+|\z)") {
              $extracted = $matches[1].Trim()
              if (-not [string]::IsNullOrWhiteSpace($extracted)) {
                $notes = $extracted
              }
            }
          }
          Set-Content release-assets/release-notes.txt $notes -Encoding utf8NoBOM

          $exe = Get-ChildItem release-assets -Filter '*setup.exe' | Select-Object -First 1
          $sig = if ($exe) { Get-Item "release-assets/$($exe.Name).sig" -ErrorAction SilentlyContinue } else { $null }
          if ($exe -and $sig) {
            $latest = @{
              version = $tag
              notes = $notes
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                "windows-x86_64" = @{
                  signature = (Get-Content $sig.FullName -Raw).Trim()
                  url = "https://github.com/LegendeSamuel/Seelig-PDF/releases/download/v$tag/$($exe.Name)"
                }
              }
            } | ConvertTo-Json -Depth 5
            Set-Content release-assets/latest.json $latest -Encoding utf8NoBOM
          }

      - name: Create Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.1" }
          $assets = Get-ChildItem release-assets -File | Where-Object { $_.Name -ne 'release-notes.txt' } | ForEach-Object { $_.FullName }
          if (Test-Path release-assets/release-notes.txt) {
            gh release create $tag @assets --draft --notes-file release-assets/release-notes.txt --title "Seelig PDF $tag"
          } else {
            gh release create $tag @assets --draft --generate-notes --title "Seelig PDF $tag"
          }
